name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Check application and tag versions
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const json = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const version = json('package.json').version;
          const tauri = json('src-tauri/tauri.conf.json').version;
          const cargo = readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Invalid application version: ${version}`);
          }
          if (tauri !== version || cargo !== version) {
            throw new Error(`Version mismatch: package=${version}, Tauri=${tauri}, Cargo=${cargo}`);
          }
          if (process.env.REF_TYPE === 'tag' && process.env.REF_NAME !== `v${version}`) {
            throw new Error(`Release tag must be v${version}, received ${process.env.REF_NAME}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test -- --run
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  bundle:
    name: Package ${{ matrix.platform }}
    needs: checks
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            bundles: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
            bundles: app,dmg
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bundles: nsis,msi
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Build native installers
        run: npm run tauri -- build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect and name installers
        shell: bash
        env:
          APP_VERSION: ${{ needs.checks.outputs.version }}
          BUILD_TARGET: ${{ matrix.target }}
          ASSET_PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          source = Path('target') / os.environ['BUILD_TARGET'] / 'release' / 'bundle'
          destination = Path('installers')
          destination.mkdir()
          stem = f"potom-{os.environ['APP_VERSION']}-{os.environ['ASSET_PLATFORM']}"
          packages = [('nsis/*.exe', '-setup.exe'), ('msi/*.msi', '.msi')] if os.environ['ASSET_PLATFORM'] == 'windows-x64' else [('dmg/*.dmg', '.dmg')]
          for pattern, suffix in packages:
              matches = list(source.glob(pattern))
              if len(matches) != 1:
                  raise RuntimeError(f'Expected one {pattern} installer, found {matches}')
              shutil.copyfile(matches[0], destination / f'{stem}{suffix}')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          path: installers/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Verify complete release and generate SHA-256 checksums
        env:
          APP_VERSION: ${{ needs.checks.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          directory = Path('installers')
          version = os.environ['APP_VERSION']
          names = {
              f'potom-{version}-windows-x64-setup.exe',
              f'potom-{version}-windows-x64.msi',
              f'potom-{version}-macos-arm64.dmg',
              f'potom-{version}-macos-x64.dmg',
          }
          files = {path.name for path in directory.iterdir() if path.is_file()}
          if files != names:
              raise RuntimeError(f'Unexpected release files. Missing: {names - files}; extra: {files - names}')
          checksums = []
          for name in sorted(names):
              path = directory / name
              if path.stat().st_size == 0:
                  raise RuntimeError(f'Empty installer: {name}')
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              checksums.append(f'{digest}  {name}\n')
          (directory / 'SHA256SUMS').write_text(''.join(checksums), encoding='utf-8')
          PY
      - name: Create release, upload installers, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.checks.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            prerelease=()
            if [[ "$APP_VERSION" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "потом. $RELEASE_TAG" --generate-notes "${prerelease[@]}"
          fi
          gh release upload "$RELEASE_TAG" installers/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
